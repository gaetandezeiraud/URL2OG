replicaCount: 2

image:
  repository: ghcr.io/gaetandezeiraud/url2og
  tag: latest
  pullPolicy: IfNotPresent

# Idle ~10Mi; one capture peaks around 220Mi of Chromium memory, plus page cache the kernel can reclaim.
# Keep the limit above that times MAX_CAPTURES.
resources:
  limits:
    cpu: "1000m"
    memory: "512Mi"
  requests:
    cpu: "10m"
    memory: "16Mi"

env:
  - name: "ALLOWED_DOMAINS"
    value: "dezeiraudgames.com"

env_secrets: {}
